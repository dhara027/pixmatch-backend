upstream pixmatch_api {
    server api:5000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    # Replace with your real domain. In development use localhost or your IP.
    server_name _;

    # ── SSL (replace cert paths for production) ───────────────────────────────
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    # ── Security Headers (nginx layer, Flask also sets these) ─────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Upload size: slightly above the per-file limit (20 MB) ───────────────
    # Batch of 20 files × 20 MB = 400 MB theoretical max, but we cap here at 25 MB
    # per HTTP request. The photo upload route handles batching inside the request.
    # For multi-photo batch uploads increase this proportionally.
    client_max_body_size 25M;

    # ── Auth endpoints — strict rate limit ────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass         http://pixmatch_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Face match upload (selfie) — moderate limit ───────────────────────────
    location /api/v1/face-match/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 10M;
        proxy_pass         http://pixmatch_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── API endpoints ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass         http://pixmatch_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Health check (no rate limit, no access log) ───────────────────────────
    location /health {
        proxy_pass http://pixmatch_api;
        access_log off;
    }

    # ── Frontend — proxy to Flask which serves the built React dist/ ──────────
    # Flask's catch-all route (serve_frontend) handles SPA routing correctly.
    # Static assets (JS/CSS/images) are served by Flask with proper MIME types.
    location / {
        proxy_pass         http://pixmatch_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
    }
}
