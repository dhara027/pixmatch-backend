services:
  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixmatch-api:latest
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      FLASK_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery — Embedding Worker ──────────────────────────────────────────────
  celery-embeddings:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixmatch-api:latest
    command: >
      celery -A app:celery_app worker
      --loglevel=info
      --queues=embeddings
      --concurrency=2
      --max-tasks-per-child=50
    env_file: .env
    environment:
      FLASK_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery — Face Match Worker ─────────────────────────────────────────────
  celery-facematch:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixmatch-api:latest
    command: >
      celery -A app:celery_app worker
      --loglevel=info
      --queues=face_match
      --concurrency=1
      --max-tasks-per-child=20
    env_file: .env
    environment:
      FLASK_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  # volatile-lru only evicts keys that have a TTL set (OTPs, reset tokens).
  # Permanent refresh-token keys and session-registry keys are NEVER evicted,
  # preventing silent user logouts under memory pressure.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
